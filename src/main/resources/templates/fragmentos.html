<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | SisCoop 3FN'">SisCoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">SisCoop 3FN</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cooperativas}">Cooperativas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/associados}">Associados</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contas}">Contas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/operacoes-credito}">Operações de Crédito</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/transacoes}">Transações</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/investimentos}">Investimentos</a></li>
                <li class="nav-item" sec:authorize="hasRole('GESTOR')">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/usuarios}">Usuários (RBAC)</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-light">
                <span class="me-3 small">
                    Utilizador: <strong sec:authentication="name">user</strong>
                    <span class="badge bg-info text-dark ms-1" sec:authentication="principal.authorities">ROLE</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alertas" class="container">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <strong>Sucesso:</strong> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <strong>Bloqueio de Regra de Negócio:</strong> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

</body>
</html>
