<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Investimentos')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: navbar}"></nav>
<div th:replace="~{fragmentos :: alertas}"></div>

<div class="container pb-5">
    <h3 class="fw-bold mb-3">Aplicações Financeiras e Controle de Liquidez/Carência</h3>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">Nova Aplicação Financeira</div>
        <div class="card-body">
            <form th:action="@{/investimentos}" th:object="${novoInvestimento}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Associado Investidor</label>
                    <select name="idAssociado" class="form-select" required>
                        <option th:each="a : ${associados}" th:value="${a.idAssociado}"
                                th:text="'#' + ${a.idAssociado} + ' - ' + ${a.segmento.descricao} + ' (' + ${a.statusAssociado} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Produto</label>
                    <select th:field="*{produtoInvestimento}" class="form-select" required>
                        <option th:each="p : ${produtos}" th:value="${p}" th:text="${p.descricao}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Liquidez</label>
                    <select th:field="*{liquidez}" class="form-select" required>
                        <option th:each="l : ${liquidezes}" th:value="${l}" th:text="${l.descricao}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Valor Aplicado (R$)</label>
                    <input type="number" step="0.01" th:field="*{valorAplicado}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Rentabilidade Anual (%)</label>
                    <input type="number" step="0.01" th:field="*{rentabilidadeAnualPercentual}" value="11.50" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Prazo (Dias)</label>
                    <input type="number" th:field="*{prazoDias}" value="360" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data da Aplicação</label>
                    <input type="date" th:field="*{dataAplicacao}" class="form-control">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Confirmar Aplicação</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Investidor / Cooperativa</th>
                    <th>Produto / Liquidez</th>
                    <th>Data Aplicação / Vencimento</th>
                    <th>Valor Aplicado</th>
                    <th>Rentabilidade a.a.</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inv : ${investimentos}">
                    <td th:text="${inv.idInvestimento}"></td>
                    <td>
                        <div class="fw-semibold" th:text="'Associado #' + ${inv.associado.idAssociado}"></div>
                        <small class="text-muted" th:text="${inv.associado.cooperativa.nome}"></small>
                    </td>
                    <td th:text="${inv.produtoInvestimento.descricao} + ' (' + ${inv.liquidez.descricao} + ')'"></td>
                    <td th:text="${inv.dataAplicacao} + ' até ' + ${inv.dataVencimento}"></td>
                    <td class="fw-bold" th:text="'R$ ' + ${#numbers.formatDecimal(inv.valorAplicado, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${inv.rentabilidadeAnualPercentual} + '%'"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${inv.statusInvestimento.name() == 'ATIVO' ? 'bg-success' : 'bg-secondary'}"
                              th:text="${inv.statusInvestimento}"></span>
                    </td>
                    <td>
                        <form th:if="${inv.statusInvestimento.name() != 'RESGATADO'}"
                              th:action="@{/investimentos/{id}/resgatar(id=${inv.idInvestimento})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-primary">Resgatar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
