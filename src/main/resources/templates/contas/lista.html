<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Contas Bancárias')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: navbar}"></nav>
<div th:replace="~{fragmentos :: alertas}"></div>

<div class="container pb-5">
    <h3 class="fw-bold mb-3">Contas Bancárias (Vinculadas em 3FN ao Associado Titular)</h3>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">Abrir Nova Conta (Valida RF02: Bloqueia Associado Inativo/Suspenso)</div>
        <div class="card-body">
            <form th:action="@{/contas}" th:object="${novaConta}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Associado Titular</label>
                    <select name="idAssociado" class="form-select" required>
                        <option th:each="a : ${associados}"
                                th:value="${a.idAssociado}"
                                th:text="'#' + ${a.idAssociado} + ' - ' + ${a.segmento.descricao} + ' (' + ${a.statusAssociado} + ') - ' + ${a.cooperativa.nome}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Tipo de Conta</label>
                    <select th:field="*{tipoConta}" class="form-select" required>
                        <option th:each="t : ${tiposConta}" th:value="${t}" th:text="${t.descricao}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Canal de Abertura</label>
                    <select th:field="*{canalAbertura}" class="form-select" required>
                        <option th:each="c : ${canais}" th:value="${c}" th:text="${c.descricao}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Saldo Inicial (R$)</label>
                    <input type="number" step="0.01" th:field="*{saldoMedioMensal}" class="form-control" value="1000.00" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Limite Crédito (R$)</label>
                    <input type="number" step="0.01" th:field="*{limiteCredito}" class="form-control" value="5000.00" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Data de Abertura</label>
                    <input type="date" th:field="*{dataAbertura}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tarifa Mensal (R$)</label>
                    <input type="number" step="0.01" th:field="*{tarifaMensal}" class="form-control" value="25.00" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Abrir Conta</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID Conta</th>
                    <th>Associado Titular</th>
                    <th>Cooperativa (Derivada 3FN)</th>
                    <th>Tipo / Canal</th>
                    <th>Abertura</th>
                    <th>Saldo Atual</th>
                    <th>Limite</th>
                    <th>Status</th>
                    <th>Transição de Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ct : ${contas}">
                    <td th:text="${ct.idConta}"></td>
                    <td th:text="'#' + ${ct.associado.idAssociado} + ' (' + ${ct.associado.segmento.descricao} + ')'"></td>
                    <td class="fw-semibold" th:text="${ct.associado.cooperativa.nome}"></td>
                    <td th:text="${ct.tipoConta.descricao} + ' / ' + ${ct.canalAbertura.descricao}"></td>
                    <td th:text="${ct.dataAbertura}"></td>
                    <td class="fw-bold" th:text="'R$ ' + ${#numbers.formatDecimal(ct.saldoMedioMensal, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(ct.limiteCredito, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${ct.statusConta.name() == 'ATIVA' ? 'bg-success' : (ct.statusConta.name() == 'BLOQUEADA' ? 'bg-warning text-dark' : 'bg-danger')}"
                              th:text="${ct.statusConta}"></span>
                    </td>
                    <td>
                        <form th:action="@{/contas/{id}/status(id=${ct.idConta})}" method="post" class="d-flex gap-1">
                            <select name="novoStatus" class="form-select form-select-sm">
                                <option th:each="st : ${statusValores}" th:value="${st}" th:text="${st}" th:selected="${st == ct.statusConta}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-dark">Aplicar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
